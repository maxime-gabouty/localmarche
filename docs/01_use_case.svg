<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 640" font-family="system-ui, sans-serif">
  <style>
    .title { font-size: 18px; font-weight: 700; fill: #1b4332; }
    .actor { font-size: 13px; font-weight: 600; fill: #1a1f1c; }
    .uc { font-size: 12px; fill: #1a1f1c; }
    .system { font-size: 14px; font-weight: 600; fill: #2d6a4f; }
    .stick { stroke: #1a1f1c; stroke-width: 2; fill: none; }
    .case { fill: #fff; stroke: #2d6a4f; stroke-width: 1.5; }
    .frame { fill: #fdfdfb; stroke: #2d6a4f; stroke-width: 2; }
    .link { stroke: #5a6b5e; stroke-width: 1; fill: none; }
  </style>

  <text x="460" y="28" text-anchor="middle" class="title">LocalMarché — Diagramme de cas d'utilisation</text>

  <!-- System frame -->
  <rect x="200" y="60" width="520" height="540" class="frame" rx="6"/>
  <text x="460" y="82" text-anchor="middle" class="system">Système LocalMarché</text>

  <!-- Use cases -->
  <ellipse cx="320" cy="130" rx="92" ry="22" class="case"/>
  <text x="320" y="135" text-anchor="middle" class="uc">Consulter producteurs</text>

  <ellipse cx="320" cy="180" rx="92" ry="22" class="case"/>
  <text x="320" y="185" text-anchor="middle" class="uc">Voir produits</text>

  <ellipse cx="600" cy="130" rx="80" ry="22" class="case"/>
  <text x="600" y="135" text-anchor="middle" class="uc">S'inscrire</text>

  <ellipse cx="600" cy="180" rx="80" ry="22" class="case"/>
  <text x="600" y="185" text-anchor="middle" class="uc">Se connecter</text>

  <ellipse cx="600" cy="230" rx="92" ry="22" class="case"/>
  <text x="600" y="235" text-anchor="middle" class="uc">Gérer son profil</text>

  <ellipse cx="320" cy="280" rx="92" ry="22" class="case"/>
  <text x="320" y="285" text-anchor="middle" class="uc">Passer une commande</text>

  <ellipse cx="320" cy="330" rx="92" ry="22" class="case"/>
  <text x="320" y="335" text-anchor="middle" class="uc">Voir mes commandes</text>

  <ellipse cx="600" cy="330" rx="92" ry="22" class="case"/>
  <text x="600" y="335" text-anchor="middle" class="uc">Gérer ses produits</text>

  <ellipse cx="600" cy="380" rx="92" ry="22" class="case"/>
  <text x="600" y="385" text-anchor="middle" class="uc">Valider/refuser cmd.</text>

  <ellipse cx="320" cy="430" rx="92" ry="22" class="case"/>
  <text x="320" y="435" text-anchor="middle" class="uc">Modérer utilisateurs</text>

  <ellipse cx="600" cy="430" rx="92" ry="22" class="case"/>
  <text x="600" y="435" text-anchor="middle" class="uc">Modérer produits</text>

  <ellipse cx="460" cy="540" rx="100" ry="22" class="case"/>
  <text x="460" y="545" text-anchor="middle" class="uc">Voir empreinte CO₂</text>

  <!-- Visiteur -->
  <g transform="translate(60,150)">
    <circle cx="20" cy="0" r="10" class="stick"/>
    <line x1="20" y1="10" x2="20" y2="40" class="stick"/>
    <line x1="5"  y1="20" x2="35" y2="20" class="stick"/>
    <line x1="20" y1="40" x2="5"  y2="60" class="stick"/>
    <line x1="20" y1="40" x2="35" y2="60" class="stick"/>
    <text x="20" y="78" text-anchor="middle" class="actor">Visiteur</text>
  </g>
  <line x1="98" y1="160" x2="228" y2="130" class="link"/>
  <line x1="98" y1="165" x2="228" y2="180" class="link"/>
  <line x1="98" y1="170" x2="360" y2="540" class="link"/>

  <!-- Consommateur -->
  <g transform="translate(60,290)">
    <circle cx="20" cy="0" r="10" class="stick"/>
    <line x1="20" y1="10" x2="20" y2="40" class="stick"/>
    <line x1="5"  y1="20" x2="35" y2="20" class="stick"/>
    <line x1="20" y1="40" x2="5"  y2="60" class="stick"/>
    <line x1="20" y1="40" x2="35" y2="60" class="stick"/>
    <text x="20" y="78" text-anchor="middle" class="actor">Consommateur</text>
  </g>
  <line x1="98" y1="290" x2="520" y2="130" class="link"/>
  <line x1="98" y1="295" x2="520" y2="180" class="link"/>
  <line x1="98" y1="300" x2="520" y2="230" class="link"/>
  <line x1="98" y1="305" x2="228" y2="280" class="link"/>
  <line x1="98" y1="310" x2="228" y2="330" class="link"/>

  <!-- Producteur -->
  <g transform="translate(820,290)">
    <circle cx="20" cy="0" r="10" class="stick"/>
    <line x1="20" y1="10" x2="20" y2="40" class="stick"/>
    <line x1="5"  y1="20" x2="35" y2="20" class="stick"/>
    <line x1="20" y1="40" x2="5"  y2="60" class="stick"/>
    <line x1="20" y1="40" x2="35" y2="60" class="stick"/>
    <text x="20" y="78" text-anchor="middle" class="actor">Producteur</text>
  </g>
  <line x1="820" y1="290" x2="680" y2="180" class="link"/>
  <line x1="820" y1="295" x2="680" y2="230" class="link"/>
  <line x1="820" y1="300" x2="692" y2="330" class="link"/>
  <line x1="820" y1="305" x2="692" y2="380" class="link"/>

  <!-- Administrateur -->
  <g transform="translate(820,440)">
    <circle cx="20" cy="0" r="10" class="stick"/>
    <line x1="20" y1="10" x2="20" y2="40" class="stick"/>
    <line x1="5"  y1="20" x2="35" y2="20" class="stick"/>
    <line x1="20" y1="40" x2="5"  y2="60" class="stick"/>
    <line x1="20" y1="40" x2="35" y2="60" class="stick"/>
    <text x="20" y="78" text-anchor="middle" class="actor">Administrateur</text>
  </g>
  <line x1="820" y1="440" x2="412" y2="430" class="link"/>
  <line x1="820" y1="445" x2="692" y2="430" class="link"/>
</svg>
