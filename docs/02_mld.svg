<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 600" font-family="system-ui, sans-serif">
  <style>
    .title { font-size: 18px; font-weight: 700; fill: #1b4332; }
    .tname { font-size: 14px; font-weight: 700; fill: #fff; }
    .col { font-size: 12px; fill: #1a1f1c; }
    .pk { font-weight: 700; fill: #2d6a4f; }
    .fk { font-style: italic; fill: #d68c45; }
    .frame { fill: #fff; stroke: #1b4332; stroke-width: 1.5; }
    .head { fill: #2d6a4f; }
    .rel { stroke: #1b4332; stroke-width: 1.5; fill: none; }
    .card { font-size: 11px; fill: #1b4332; font-weight: 600; }
  </style>

  <text x="490" y="30" text-anchor="middle" class="title">LocalMarché — Modèle Logique de Données (MLD)</text>

  <!-- Table users -->
  <rect x="40" y="70" width="220" height="220" class="frame" rx="4"/>
  <rect x="40" y="70" width="220" height="28" class="head" rx="4"/>
  <text x="150" y="89" text-anchor="middle" class="tname">users</text>
  <text x="55" y="118" class="col"><tspan class="pk">PK</tspan>  id : INT UNSIGNED</text>
  <text x="55" y="138" class="col">     nom : VARCHAR(80)</text>
  <text x="55" y="158" class="col">     prenom : VARCHAR(80)</text>
  <text x="55" y="178" class="col"><tspan font-weight="700">UQ</tspan>  email : VARCHAR(150)</text>
  <text x="55" y="198" class="col">     password : VARCHAR(255)</text>
  <text x="55" y="218" class="col">     role : ENUM</text>
  <text x="55" y="238" class="col">     ville : VARCHAR(80)</text>
  <text x="55" y="258" class="col">     code_postal : VARCHAR(10)</text>
  <text x="55" y="278" class="col">     date_inscription : DATETIME</text>

  <!-- Table products -->
  <rect x="380" y="70" width="220" height="200" class="frame" rx="4"/>
  <rect x="380" y="70" width="220" height="28" class="head" rx="4"/>
  <text x="490" y="89" text-anchor="middle" class="tname">products</text>
  <text x="395" y="118" class="col"><tspan class="pk">PK</tspan>  id : INT UNSIGNED</text>
  <text x="395" y="138" class="col">     nom : VARCHAR(120)</text>
  <text x="395" y="158" class="col">     description : VARCHAR(200)</text>
  <text x="395" y="178" class="col">     prix : DECIMAL(8,2)</text>
  <text x="395" y="198" class="col">     unite : ENUM</text>
  <text x="395" y="218" class="col">     disponible : TINYINT(1)</text>
  <text x="395" y="238" class="col"><tspan class="fk">FK</tspan>  id_producteur → users.id</text>
  <text x="395" y="258" class="col">     date_creation : DATETIME</text>

  <!-- Table orders -->
  <rect x="720" y="70" width="220" height="180" class="frame" rx="4"/>
  <rect x="720" y="70" width="220" height="28" class="head" rx="4"/>
  <text x="830" y="89" text-anchor="middle" class="tname">orders</text>
  <text x="735" y="118" class="col"><tspan class="pk">PK</tspan>  id : INT UNSIGNED</text>
  <text x="735" y="138" class="col"><tspan class="fk">FK</tspan>  id_consommateur → users.id</text>
  <text x="735" y="158" class="col"><tspan class="fk">FK</tspan>  id_producteur → users.id</text>
  <text x="735" y="178" class="col">     date_commande : DATETIME</text>
  <text x="735" y="198" class="col">     statut : ENUM</text>
  <text x="735" y="218" class="col">     total : DECIMAL(10,2)</text>

  <!-- Table order_items -->
  <rect x="380" y="380" width="220" height="160" class="frame" rx="4"/>
  <rect x="380" y="380" width="220" height="28" class="head" rx="4"/>
  <text x="490" y="399" text-anchor="middle" class="tname">order_items</text>
  <text x="395" y="428" class="col"><tspan class="pk">PK</tspan>  id : INT UNSIGNED</text>
  <text x="395" y="448" class="col"><tspan class="fk">FK</tspan>  id_order → orders.id</text>
  <text x="395" y="468" class="col"><tspan class="fk">FK</tspan>  id_product → products.id</text>
  <text x="395" y="488" class="col">     quantite : DECIMAL(8,2)</text>
  <text x="395" y="508" class="col">     prix_unitaire : DECIMAL(8,2)</text>

  <!-- Relations -->
  <!-- users 1,1 -- 0,N products -->
  <line x1="260" y1="180" x2="380" y2="240" class="rel"/>
  <text x="270" y="170" class="card">1,1</text>
  <text x="350" y="255" class="card">0,N</text>

  <!-- users 1,1 -- 0,N orders (consommateur) -->
  <line x1="260" y1="200" x2="720" y2="140" class="rel"/>
  <text x="265" y="195" class="card">1,1</text>
  <text x="690" y="135" class="card">0,N (cons.)</text>

  <!-- users 1,1 -- 0,N orders (producteur) -->
  <line x1="260" y1="220" x2="720" y2="160" class="rel"/>
  <text x="265" y="235" class="card">1,1</text>
  <text x="690" y="175" class="card">0,N (prod.)</text>

  <!-- orders 1,1 -- 1,N order_items -->
  <line x1="830" y1="250" x2="600" y2="430" class="rel"/>
  <text x="820" y="265" class="card">1,1</text>
  <text x="590" y="425" class="card">1,N</text>

  <!-- products 1,1 -- 0,N order_items -->
  <line x1="490" y1="270" x2="490" y2="380" class="rel"/>
  <text x="500" y="290" class="card">1,1</text>
  <text x="500" y="370" class="card">0,N</text>

  <!-- Légende -->
  <rect x="40" y="510" width="280" height="70" class="frame" rx="4"/>
  <text x="55" y="530" class="col" font-weight="700">Légende</text>
  <text x="55" y="548" class="col"><tspan class="pk">PK</tspan> : clé primaire (Primary Key)</text>
  <text x="55" y="565" class="col"><tspan class="fk">FK</tspan> : clé étrangère (Foreign Key)</text>
</svg>
